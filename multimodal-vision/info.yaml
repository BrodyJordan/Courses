title: 'Multimodal Computer Vision - Principles and Applications'
short: 'MultiCV'
course: 'ECEN-689'
description: 'Motivations, algorithms, and models for multimodal computer vision; integration of images, text, and LiDAR; image formation and camera models; 3D vision and multi-view geometry; representation learning and self- supervised methods; generative AI and diffusion processes; applications in robotics, autonomous driving, and AR/VR; hands-on labs to build, fine-tune, and deploy multimodal vision models; tasks include text-to-image generation, 3D generation and reconstruction, and robotic perception.'
semester: 'Spring 2026'
lecturetime: 'TTh 9:35 AM - 10:50 AM'
lecturelocation: 'AIEN M113'
url: 'https://canvas.tamu.edu/courses/434010'
instructor: 'Dr. Zhiwen Fan'